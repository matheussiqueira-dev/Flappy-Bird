name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Validate web surface
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: web
    permissions:
      contents: read
    env:
      APP_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$APP_URL/api/health" > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: Verify pages, APIs and layout
        run: npm run verify:browser

      # Usa a câmera falsa do Chromium e baixa o modelo de mão do Google (~7,8 MB).
      - name: Verify gesture control
        run: npm run verify:gestures

      - name: Server log on failure
        if: failure()
        run: cat server.log

  python:
    name: Validate Python engine
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python engine
        run: python -m py_compile config.py game_logic.py gesture_mapping.py hand_tracking.py main.py
