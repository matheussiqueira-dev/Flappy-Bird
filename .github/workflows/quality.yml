name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate web and Python surfaces
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python engine
        run: python -m py_compile config.py game_logic.py gesture_mapping.py hand_tracking.py main.py
